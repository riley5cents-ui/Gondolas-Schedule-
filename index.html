<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gondolas Schedule</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>

*{box-sizing:border-box;margin:0;padding:0}
body{background:#07101e;color:#dce8f5;font-family:'Outfit',system-ui,sans-serif;min-height:100vh}
::-webkit-scrollbar{width:4px;height:4px;background:transparent}
::-webkit-scrollbar-thumb{background:#1a2e46;border-radius:2px}
#app{max-width:480px;margin:0 auto;padding-bottom:24px}
.app-header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;
  border-bottom:1px solid #0e1c2e;background:#050e1a;gap:8px;position:sticky;top:0;z-index:100}
.app-header h1{font-size:13px;font-weight:600;color:#c8d8f0;letter-spacing:.3px}
.app-header .sub{font-size:10px;color:#1e3a5a;font-family:'JetBrains Mono',monospace;margin-top:1px}
select{background:#0d1929;border:1px solid #1a2e46;color:#7aa8d0;font-size:11px;
  padding:4px 8px;border-radius:6px;cursor:pointer;font-family:'Outfit',sans-serif;max-width:148px;outline:none}
.tab-bar{display:flex;background:#050e1a;border-bottom:1px solid #0a1828;position:sticky;top:52px;z-index:99}
.tab-btn{flex:1;padding:9px 4px;text-align:center;font-size:12px;font-weight:500;color:#2d4a6a;
  background:transparent;border:none;border-bottom:2px solid transparent;cursor:pointer;
  font-family:'Outfit',sans-serif;transition:color .15s,border-color .15s;white-space:nowrap}
.tab-btn:hover{color:#4a7a9b}
.tab-btn.active{color:#d97706;border-bottom-color:#d97706;font-weight:700}
.week-tabs{display:flex;gap:6px;padding:8px 8px 4px;overflow-x:auto;background:#050e1a;
  border-bottom:1px solid #0a1828;position:sticky;top:52px;z-index:98}
.week-tabs::-webkit-scrollbar{height:0}
.wtab{flex-shrink:0;background:#0a1828;border:1px solid #0e1c2e;border-radius:8px;
  padding:6px 10px;cursor:pointer;font-family:'Outfit',sans-serif;min-width:90px}
.wtab:hover{border-color:#1a2e46}
.wtab.active{background:rgba(30,58,90,0.5);border-color:#1a3a5a}
.wtab-month{font-size:9px;font-weight:600;letter-spacing:1px;color:#1e3a5a;text-align:center;margin-bottom:3px}
.wtab-days{display:flex;justify-content:space-between;gap:2px}
.wtab-day{text-align:center;min-width:14px}
.wtab-ind{width:5px;height:5px;border-radius:50%;margin:2px auto 0}
.wtab-ind.g{background:#3b82f6}
.wtab-ind.p{background:#d97706}
.wtab-ind-gp{width:10px;height:5px;border-radius:3px;background:linear-gradient(90deg,#3b82f6 50%,#d97706 50%);margin:2px auto 0}
.wtab-dl{font-size:8px;color:#1e3a5a;margin-bottom:1px}
.wtab-dn{font-size:11px;font-weight:500;color:#2d4a6a;line-height:1;cursor:pointer;border-radius:50%;
  width:18px;height:18px;display:flex;align-items:center;justify-content:center}
.wtab-dn.today{background:#d4af37;color:#fff;font-weight:700}
.wtab-dn.working{color:#4ade80;font-weight:700}
.wtab-dn.viewing.working{background:rgba(74,222,128,0.25);color:#4ade80;font-weight:700}
.wtab-dn.viewing:not(.working){background:rgba(42,74,106,0.5);color:#7aa8d0}
.hint{font-size:10px;color:#1a3050;font-style:italic;text-align:right;padding:4px 14px 2px}
.view-title{font-size:16px;font-weight:700;color:#d97706;padding:12px 14px 4px}
#next-shift-bar{padding:8px 14px;background:rgba(202,138,4,0.07);
  border-bottom:1px solid rgba(202,138,4,0.12);gap:6px;align-items:center;flex-wrap:wrap;display:flex}
#next-shift-bar .ns-label{font-size:11px;color:#92400e;font-weight:600;letter-spacing:.4px;text-transform:uppercase;flex-shrink:0}
#next-shift-bar .ns-content{font-size:12px;color:#fbbf24;font-weight:500}
#next-shift-bar .ns-stn{font-size:11px;color:#d97706;margin-left:4px;opacity:.8}
#cmp-bar{display:none;align-items:center;padding:6px 12px;gap:8px;flex-wrap:wrap;
  border-bottom:1px solid #0a1828;background:#050e1a;min-height:38px}
.cmp-label{font-size:11px;font-weight:600;letter-spacing:.5px;color:#1e3a5a;text-transform:uppercase}
.cmp-chip{display:flex;align-items:center;gap:3px;background:rgba(34,197,94,0.12);
  border:1px solid rgba(34,197,94,0.3);border-radius:5px;padding:2px 6px 2px 8px;font-size:11px;color:#4ade80}
.cmp-chip-x{background:none;border:none;color:#4ade80;cursor:pointer;font-size:13px;padding:0 1px;line-height:1}
#cmp-add-btn{background:rgba(59,130,246,0.1);border:1px solid rgba(59,130,246,0.3);
  border-radius:6px;color:#60a5fa;font-size:12px;cursor:pointer;padding:4px 11px;
  font-family:'Outfit',sans-serif;white-space:nowrap;flex-shrink:0}
#cal-export-btn{background:rgba(34,197,94,0.1);border:1px solid rgba(34,197,94,0.3);
  border-radius:6px;color:#4ade80;font-size:12px;cursor:pointer;padding:4px 11px;
  font-family:'Outfit',sans-serif;white-space:nowrap;flex-shrink:0}
#hrs-badge{font-size:12px;color:#d97706;font-weight:600;white-space:nowrap;
  background:rgba(202,138,4,0.1);border:1px solid rgba(202,138,4,0.25);
  border-radius:5px;padding:3px 8px;flex-shrink:0}
.week-header{display:flex;border-bottom:1px solid #0a1828}
.week-header .axis-spacer{flex-shrink:0}
.wk-day-hdr{flex:1;text-align:center;padding:5px 0 4px;cursor:pointer;
  border-left:1px solid #0a1828;transition:background .12s}
.wk-day-hdr:hover{background:#0d1929}
.wk-day-hdr.working{background:rgba(74,222,128,0.07)}
.wk-day-hdr.today{background:rgba(212,175,55,0.07);box-shadow:inset 1.5px 1.5px 0 rgba(212,175,55,0.85),inset -1.5px 0 0 rgba(212,175,55,0.85)}
.wk-day-hdr .day-name{font-size:10px;font-weight:500;color:#2d4a6a;letter-spacing:.2px}
.wk-day-hdr .day-num{font-size:13px;font-weight:600;color:#2d4a6a;line-height:1.2;font-family:'JetBrains Mono',monospace}
.wk-day-hdr.working .day-num{color:#4ade80}
.wk-day-hdr.today .day-num{color:#d4af37;font-weight:700}
/* My Week per-restaurant highlight */
.wk-day-hdr.only-g{background:rgba(59,130,246,0.1)}
.wk-day-hdr.only-g .day-name,.wk-day-hdr.only-g .day-num{color:#60a5fa;font-weight:700}
.wk-day-hdr.only-p{background:rgba(202,138,4,0.1)}
.wk-day-hdr.only-p .day-name,.wk-day-hdr.only-p .day-num{color:#d97706;font-weight:700}
.wk-day-hdr.both-gp{background:linear-gradient(90deg,rgba(59,130,246,0.12) 50%,rgba(202,138,4,0.12) 50%)}
.wk-day-hdr.both-gp .day-name{color:#7aa8d0;font-weight:700}
.wk-day-hdr.both-gp .day-num{color:#7aa8d0;font-weight:700}
/* Indicator dots */
.day-dot-g{width:6px;height:6px;border-radius:50%;background:#3b82f6;margin:2px auto 0}
.day-dot-p{width:6px;height:6px;border-radius:50%;background:#d97706;margin:2px auto 0}
.day-dot-gp{width:12px;height:6px;border-radius:3px;background:linear-gradient(90deg,#3b82f6 50%,#d97706 50%);margin:2px auto 0}
.wk-day-hdr.working .day-name{color:#4ade80;font-weight:600}
.wk-day-hdr.today .day-name{color:#d4af37;font-weight:600}
.wk-day-hdr .day-dot{width:4px;height:4px;border-radius:50%;background:#4ade80;margin:2px auto 0}
.week-grid{display:flex;position:relative}
.wk-axis{flex-shrink:0;position:relative}
.wk-axis-lbl{position:absolute;right:4px;font-size:10px;color:#1a3050;
  font-family:'JetBrains Mono',monospace;transform:translateY(-50%);line-height:1;white-space:nowrap}
.week-cols{flex:1;display:flex;position:relative}
.wk-gridline{position:absolute;left:0;right:0;border-top:1px solid #0a1828;pointer-events:none}
.wk-pmline{position:absolute;left:0;right:0;border-top:1px solid rgba(202,138,4,0.2);pointer-events:none}
.wk-day-col{flex:1;display:flex;cursor:pointer;position:relative;border-left:1px solid #0a1828}
.wk-day-col.today{box-shadow:inset 1.5px -1.5px 0 rgba(212,175,55,0.85),inset -1.5px 0 0 rgba(212,175,55,0.85)}
.wk-sub{flex:1;position:relative;overflow:hidden}
.wk-bar{position:absolute;left:0;right:0}
.week-legend{display:flex;justify-content:center;align-items:center;gap:14px;
  padding:8px 0;border-top:1px solid #0a1828}
.legend-item{display:flex;align-items:center;gap:5px;font-size:11px;color:#2d4a6a}
.legend-swatch{width:10px;height:10px;border-radius:2px;flex-shrink:0}
.day-strip{display:flex;align-items:center;padding:7px 8px;border-bottom:1px solid #0a1828;gap:4px;
  overflow-x:auto;background:#050e1a;flex-wrap:nowrap;position:sticky;top:106px;z-index:90}
.day-strip::-webkit-scrollbar{height:0}
.day-btn{cursor:pointer;font-size:11px;padding:11px 14px;border-radius:5px;
  border:1px solid #0e1c2e;background:transparent;color:#2d4a6a;
  font-family:'Outfit',sans-serif;font-weight:400;flex-shrink:0;white-space:nowrap;transition:background .12s,color .12s}
.day-btn:hover{background:#0d1929;color:#4a7a9b}
.day-btn.active{background:rgba(202,138,4,0.18);border-color:rgba(202,138,4,0.5);color:#d97706;font-weight:600}
.day-btn.active-off{background:rgba(42,74,106,0.2);border-color:rgba(42,74,106,0.5);color:#7aa8d0;font-weight:500}
.day-btn.today{border-color:rgba(202,138,4,0.4);color:#b45309}
.day-btn.working{border-color:rgba(74,222,128,0.35);color:#22c55e}
.back-btn{cursor:pointer;font-size:13px;padding:11px 14px;border-radius:8px;
  border:1px solid #1a2e46;background:rgba(59,130,246,0.08);color:#3b82f6;
  font-family:'Outfit',sans-serif;font-weight:600;flex-shrink:0;display:flex;align-items:center;gap:6px;transition:background .12s}
.back-btn:hover{background:rgba(59,130,246,0.15)}
.day-edge-btn{position:fixed;top:55%;transform:translateY(-50%);z-index:150;
  background:rgba(10,24,40,0.88);border:1px solid #1a2e46;color:#3b82f6;
  font-size:22px;width:28px;height:72px;cursor:pointer;display:none;
  align-items:center;justify-content:center;font-family:'Outfit',sans-serif;
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
#day-prev-edge{left:0;border-radius:0 10px 10px 0;border-left:none}
#day-next-edge{right:0;border-radius:10px 0 0 10px;border-right:none}
.day-edge-btn.visible{display:flex}
.day-edge-btn:active{background:rgba(59,130,246,0.2)}
.day-title{padding:8px 14px 4px;display:flex;align-items:center;gap:10px}
.day-title h2{font-size:16px;font-weight:600;color:#c8d8f0}
.day-hrs-badge{font-size:13px;font-weight:700;color:#fbbf24;
  background:rgba(202,138,4,0.15);border:1px solid rgba(202,138,4,0.35);
  border-radius:6px;padding:2px 9px;font-family:'JetBrains Mono',monospace}
.col-hdrs{display:flex;padding:0 8px 6px;gap:6px}
.col-hdr{flex:1;text-align:center;font-size:11px;font-weight:600;letter-spacing:.7px;
  padding:4px 0;border-radius:4px;display:flex;align-items:center;justify-content:center;gap:4px}
.col-hdr.dt{color:#60a5fa;background:rgba(59,130,246,0.1)}
.col-hdr.sb{color:#f87171;background:rgba(239,68,68,0.1)}
.col-hdr.dl{color:#fb923c;background:rgba(249,115,22,0.1)}
.col-hdr.my-g{color:#60a5fa;background:rgba(59,130,246,0.1)}
.col-hdr.my-p{color:#fb923c;background:rgba(249,115,22,0.1)}
.time-grid{display:flex;position:relative}
.t-axis{flex-shrink:0;position:relative}
.t-axis-lbl{position:absolute;right:5px;font-size:11px;color:#1e3a5a;
  font-family:'JetBrains Mono',monospace;transform:translateY(-50%);line-height:1;white-space:nowrap}
.t-axis-pm{position:absolute;right:4px;font-size:10px;color:rgba(202,138,4,0.7);
  font-family:'JetBrains Mono',monospace;font-weight:600;transform:translateY(-50%);line-height:1}
.t-content{flex:1;position:relative;display:flex;gap:6px;padding-right:6px}
.t-hrline{position:absolute;left:0;right:0;border-top:1px solid #0a1828;pointer-events:none}
.t-halfline{position:absolute;left:0;right:0;border-top:1px dashed rgba(14,28,46,0.7);pointer-events:none}
.t-pmline{position:absolute;left:0;right:0;border-top:1px solid rgba(202,138,4,0.25);pointer-events:none}
.loc-col{flex-shrink:0;width:280px;position:relative}
.t-scroll-area{flex:1;overflow-x:auto;-webkit-overflow-scrolling:touch}
.t-scroll-area::-webkit-scrollbar{height:3px}
.t-scroll-area::-webkit-scrollbar-thumb{background:#1a2e46;border-radius:2px}
.t-cols-inner{position:relative;display:flex;gap:6px;padding-right:6px}
.col-hdrs-scroll{display:flex;gap:6px;padding:0 6px 6px 0}
.shift{position:absolute;border-radius:0 4px 4px 0;padding:2px 5px;overflow:hidden;box-sizing:border-box}
.shift-name{font-size:11px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shift-stn{font-size:10px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.7;margin-top:1px}
.shift.dt{background:rgba(59,130,246,0.14);border:.5px solid rgba(59,130,246,0.5);border-left:2.5px solid #3b82f6}
.shift.dt .shift-name{color:#93c5fd;font-weight:400}
.shift.dt .shift-stn{color:#60a5fa}
.shift.sb{background:rgba(239,68,68,0.13);border:.5px solid rgba(239,68,68,0.5);border-left:2.5px solid #ef4444}
.shift.sb .shift-name{color:#fca5a5;font-weight:400}
.shift.sb .shift-stn{color:#f87171}
.shift.dl{background:rgba(249,115,22,0.13);border:.5px solid rgba(249,115,22,0.5);border-left:2.5px solid #f97316}
.shift.dl .shift-name{color:#fdba74;font-weight:400}
.shift.dl .shift-stn{color:#fb923c}
.shift.me{background:rgba(74,222,128,0.18);border:.5px solid rgba(74,222,128,0.5);border-left:2.5px solid #4ade80;z-index:20!important}
.shift.me .shift-name{color:#4ade80;font-weight:600}
.shift.me .shift-stn{color:#86efac}
.shift.open{background:rgba(55,65,81,0.15);border:.5px solid rgba(55,65,81,0.4);border-left:2.5px solid #4b5563}
.shift.open .shift-name{color:#6b7280}
.shift.my-g{background:rgba(59,130,246,0.2);border:.5px solid rgba(59,130,246,0.7);border-left:3px solid #3b82f6}
.shift.my-g .shift-name{color:#93c5fd;font-weight:600}
.shift.my-g .shift-stn{color:#60a5fa}
.shift.my-p{background:rgba(249,115,22,0.2);border:.5px solid rgba(249,115,22,0.7);border-left:3px solid #f97316}
.shift.my-p .shift-name{color:#fdba74;font-weight:600}
.shift.my-p .shift-stn{color:#fb923c}
.footer{display:flex;border-top:1px solid #0a1828;margin-top:8px;background:#050e1a}
.footer-cell{flex:1;padding:12px 0;text-align:center}
.footer-lbl{font-size:11px;font-weight:600;letter-spacing:.5px;margin-bottom:8px}
.footer-lbl.dt,.footer-lbl.my-g{color:#60a5fa}
.footer-lbl.sb{color:#f87171}
.footer-lbl.dl,.footer-lbl.my-p{color:#fb923c}
.footer-nums{display:flex;justify-content:center;gap:20px}
.footer-num{text-align:center}
.footer-period{font-size:11px;color:#1e3a5a;margin-bottom:2px;font-family:'JetBrains Mono',monospace}
.footer-val{font-size:28px;font-weight:600;color:#c8d8f0;font-family:'JetBrains Mono',monospace;line-height:1.1;font-variant-numeric:tabular-nums}
#shift-popup{position:fixed;background:#0d1929;border:1px solid #1a2e46;border-radius:10px;
  padding:10px 12px;z-index:300;min-width:180px;max-width:240px;box-shadow:0 8px 32px rgba(0,0,0,0.5);display:none}
#shift-popup.visible{display:block}
.sp-name{font-size:13px;font-weight:700;margin-bottom:6px;color:#c8d8f0}
.sp-name.dt,.sp-name.my-g{color:#93c5fd}
.sp-name.sb{color:#fca5a5}
.sp-name.dl,.sp-name.my-p{color:#fdba74}
.sp-name.me,.sp-name.cmp{color:#4ade80}
.sp-name.open{color:#6b7280}
.sp-chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px}
.sp-chip{font-size:11px;padding:2px 7px;border-radius:4px;font-family:'JetBrains Mono',monospace;
  background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);color:#7aa8d0;white-space:nowrap}
.sp-chip.hrs{color:#fbbf24;background:rgba(202,138,4,0.12);border-color:rgba(202,138,4,0.25)}
.sp-badge{font-size:10px;padding:2px 7px;border-radius:4px;margin-bottom:6px;display:inline-block;
  font-weight:600;letter-spacing:.4px;text-transform:uppercase}
.sp-badge.dt,.sp-badge.my-g{color:#60a5fa;background:rgba(59,130,246,0.1)}
.sp-badge.sb{color:#f87171;background:rgba(239,68,68,0.1)}
.sp-badge.dl,.sp-badge.my-p{color:#fb923c;background:rgba(249,115,22,0.1)}
.sp-badge.me,.sp-badge.cmp{color:#4ade80;background:rgba(74,222,128,0.1)}
.sp-badge.open{color:#6b7280;background:rgba(55,65,81,0.2)}
.sp-actions{display:flex;gap:6px;margin-top:6px}
.sp-action-btn{flex:1;font-size:11px;padding:5px;border-radius:5px;border:1px solid #1a2e46;
  background:#0a1828;color:#7aa8d0;cursor:pointer;font-family:'Outfit',sans-serif;transition:background .1s}
.sp-action-btn:hover{background:#0d1929}
.sp-hl{border-color:rgba(74,222,128,0.3);color:#4ade80}
.sp-cmp{border-color:rgba(34,197,94,0.3);color:#22c55e}
.wk-start-btn-el{background:#0d1929;border:1px solid #1a2e46;color:#7aa8d0;font-size:11px;
  padding:5px 8px;border-radius:6px;cursor:pointer;font-family:'Outfit',sans-serif;
  display:flex;align-items:center;gap:5px;white-space:nowrap}
.wk-start-menu{display:none;position:absolute;right:14px;top:56px;background:#0d1929;
  border:1px solid #1a2e46;border-radius:8px;z-index:200;overflow:hidden;min-width:120px}
.wk-start-opt{padding:8px 14px;font-size:12px;color:#7aa8d0;cursor:pointer;font-family:'Outfit',sans-serif}
.wk-start-opt:hover{background:#0a1828}
.wk-start-opt.active{color:#d97706;font-weight:600}
.cmp-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:190;display:none}
.cmp-backdrop.open{display:block}
#cmp-sheet{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;
  background:#0d1929;border-radius:16px 16px 0 0;border-top:1px solid #1a2e46;
  z-index:200;transform:translateY(100%);transition:transform .3s ease;max-height:72vh;overflow-y:auto;display:none}
#cmp-sheet.open{transform:translateY(0);display:block}
.cmp-sheet-hdr{display:flex;justify-content:space-between;align-items:center;
  padding:16px 16px 8px;border-bottom:1px solid #0a1828}
.cmp-sheet-title{font-size:14px;font-weight:600;color:#c8d8f0}
.cmp-sheet-done{background:rgba(59,130,246,0.15);border:1px solid rgba(59,130,246,0.3);
  border-radius:6px;color:#60a5fa;font-size:12px;cursor:pointer;padding:4px 12px;font-family:'Outfit',sans-serif}
.cmp-list-item{display:flex;align-items:center;justify-content:space-between;
  padding:10px 16px;border-bottom:1px solid #0a1828;cursor:pointer}
.cmp-list-item:hover{background:#0a1828}
.cmp-list-item.selected{background:rgba(34,197,94,0.08)}
.cmp-item-name{font-size:13px;color:#c8d8f0}
.cmp-item-check{width:18px;height:18px;border-radius:50%;border:1px solid #1a2e46;
  background:rgba(34,197,94,0.15);display:flex;align-items:center;justify-content:center}
.cmp-item-check.on{background:rgba(34,197,94,0.3);border-color:rgba(34,197,94,0.5)}


/* ── MY MONTH PANEL ────────────────────────────────────────────── */
#month-panel{background:#050e1a}
.month-toggle-btn{display:flex;align-items:center;justify-content:space-between;
  padding:10px 14px;cursor:pointer;border-bottom:1px solid #0e1c2e;
  font-size:13px;font-weight:600;color:#7aa8d0;letter-spacing:.2px;

const P_LOGO='';

const _now=new Date(),_todayKey=String(_now.getMonth()+1).padStart(2,'0')+'-'+String(_now.getDate()).padStart(2,'0');
function _findWeek(weeks){const i=weeks.findIndex(w=>w.days.some(d=>d.k===_todayKey));return i>=0?i:weeks.length-1;}
// Returns 7 consecutive days starting on weekStart, crossing into next week if needed
function getOrdDays(weeks,weekIdx,ws){
  const cur=weeks[weekIdx].days;
  if(ws===1) return cur; // Monday start — no crossing
  const splitIdx=ws===0?6:ws-1; // Sun→idx6, Tue→idx1, Wed→idx2 etc.
  const first=cur.slice(splitIdx);
  const needed=7-first.length;
  if(needed===0) return first;
  const nxt=weeks[weekIdx+1];
  const second=nxt?nxt.days.slice(0,needed):cur.slice(0,needed); // fallback=old wrap
  return [...first,...second];
}
let state={
  view:'week',di:0,week:_findWeek(GONDOLAS_WEEKS),me:'',cmp:[],

const toM=t=>{const[h,m]=t.split(':').map(Number);return h*60+m;};
const fmtM=m=>{const h=Math.floor(m/60),mn=m%60,pm=h>=12,dh=h>12?h-12:h===0?12:h;
  return `${dh}${mn?':'+String(mn).padStart(2,'0'):''}${pm?'p':'a'}`;};
function el(tag,cls,style){
  const e=document.createElement(tag);

}
function doLayout(shifts){
  const ss=[...shifts].map(s=>({...s})).sort((a,b)=>toM(a.s)-toM(b.s));
  const ends=[];
  for(const s of ss){const sm=toM(s.s);let c=ends.findIndex(e=>e<=sm);if(c<0)c=ends.length;s._c=c;ends[c]=toM(s.e);}
  for(const s of ss){const sm=toM(s.s),em=toM(s.e);s._n=Math.max(...ss.filter(o=>toM(o.s)<em&&toM(o.e)>sm).map(o=>o._c))+1;}
  return ss;
}

let _popPinned=false;

function showPopup(sh,me,loc,ev,restName){
  const isMe=sh.name===me,isOp=!!sh.open,isMy=!!sh.rest;
  const isCmp=state.cmp&&state.cmp.includes(sh.name);
  const locCls=isMy?(sh.rest==='g'?'my-g':'my-p'):(isMe?'me':isCmp?'cmp':isOp?'open':loc);
  document.getElementById('sp-name').textContent=isOp?'Open Shift':sh.name;

  const hrs=(toM(sh.e)-toM(sh.s))/60;
  document.getElementById('sp-chips').innerHTML=
    `<span class="sp-chip">${fmtM(toM(sh.s))} \u2013 ${fmtM(toM(sh.e))}</span>`+
    (sh.stn?`<span class="sp-chip">${sh.stn}</span>`:'')+
    `<span class="sp-chip hrs">${hrs%1===0?hrs:hrs.toFixed(1)}h shift</span>`;
  let badgeTxt=isOp?'Open':isMy?(sh.rest==='g'?'Gondolas':'Piecasso'):
    (loc==='dt'?(restName==='Piecasso'?'Counter':'Downtown'):loc==='sb'?(restName==='Piecasso'?'Pizza':'Snack Bar'):'Delivery');
  const badge=document.getElementById('sp-badge');
  badge.textContent=badgeTxt;badge.className='sp-badge '+locCls;
  const hlBtn=document.getElementById('sp-hl-btn'),cmpBtn=document.getElementById('sp-cmp-btn');
  if(isOp||isMy){hlBtn.style.display='none';cmpBtn.style.display='none';}
  else{
    hlBtn.style.display='';cmpBtn.style.display='';
    hlBtn.textContent=isMe?'\u2605 You':'\u2606 Highlight me';
    cmpBtn.textContent=(st.cmp&&st.cmp.includes(sh.name))?'\u2713 Comparing':'\u263a Compare';
    hlBtn.onclick=()=>{state.me=sh.name;populateDropdown();updateCmpBar();render();hidePopup();};
    cmpBtn.onclick=()=>{
      if(!state.cmp)return;
      if(state.cmp.includes(sh.name))state.cmp=state.cmp.filter(c=>c!==sh.name);
      else if(sh.name!==state.me)state.cmp.push(sh.name);
      updateCmpBar();render();hidePopup();
    };
  }
  const pop=document.getElementById('shift-popup');pop.classList.add('visible');
  const rect=ev.target.getBoundingClientRect();
  const pw=pop.offsetWidth||200;
  let left=rect.right+6;if(left+pw>window.innerWidth-8)left=rect.left-pw-6;

  const isMe=sh.name===me,isOp=!!sh.open,isMy=!!sh.rest;
  const top=(toM(sh.s)-TS_val)*PD_val+1;
  const ht=Math.max(18,(toM(sh.e)-toM(sh.s))*PD_val-2);
  const cls='shift '+(isMe?'me':isMy?(sh.rest==='g'?'my-g':'my-p'):isOp?'open':loc);
  const abbrev=sh.name.split(' ')[0];
  const d=el('div',cls,{position:'absolute',top:top+'px',height:ht+'px',
    left:(sh._c*slotW)+'px',width:(slotW-3)+'px',zIndex:isMe||isMy?'20':'1'});
  const nm=el('div','shift-name');
  if(isMe) nm.textContent='\u2605 '+abbrev;
  else if(isMy) nm.textContent=(sh.rest==='g'?'G\u00b7 ':'P\u00b7 ')+abbrev;
  else nm.textContent=isOp?'Open':abbrev;
  d.appendChild(nm);
  if(ht>32&&sh.stn&&!isMy){const s=el('div','shift-stn');s.textContent=sh.stn;d.appendChild(s);}
  d.addEventListener('mouseenter',ev=>{if(!_popPinned)showPopup(sh,me,loc,ev,restName);});
  d.addEventListener('mouseleave',()=>{if(!_popPinned)hidePopup();});
  d.addEventListener('click',ev=>{ev.stopPropagation();showPopup(sh,me,loc,ev,restName);});
  return d;
}
function buildLocCol(shifts,me,loc,PD_val,TS_val,TE_val,restName){
  const laid=doLayout(shifts);
  const maxN=laid.length?Math.max(...laid.map(s=>s._n)):1;
  const slotW=MIN_SLOT;
  const colW=maxN*slotW;
  const col=el('div','loc-col',{height:(TE_val-TS_val)*PD_val+'px',width:colW+'px',flexShrink:'0'});
  laid.forEach(sh=>col.appendChild(buildShift(sh,me,loc,PD_val,TS_val,restName,slotW)));
  return col;
}
// Pre-calculate column width without building DOM (for headers)
function calcColW(shifts){
  if(!shifts.length)return MIN_SLOT;
  const laid=doLayout([...shifts].map(s=>({...s})));
  return Math.max(...laid.map(s=>s._n))*MIN_SLOT;
}
// ── WEEK VIEW ────────────────────────────────────────────────────────────────────────────

// ── MY MONTH PANEL ───────────────────────────────────────────────────────────
const MONTHS_FULL=['January','February','March','April','May','June','July','August','September','October','November','December'];
function renderMonthPanel(){
  const sm=state;
  const panel=document.getElementById('month-panel');
  panel.innerHTML='';panel.style.display='block';
  const btn=el('div','month-toggle-btn'+(sm.monthOpen?' open':''));
  const lbl=el('span');lbl.textContent='My Month';btn.appendChild(lbl);
  const arr=el('span','month-toggle-arrow');arr.textContent=sm.monthOpen?'▲':'▼';btn.appendChild(arr);
  btn.onclick=()=>{sm.monthOpen=!sm.monthOpen;renderMonthPanel();};
  panel.appendChild(btn);
  if(!sm.monthOpen) return;
  const wrap=el('div','month-cal-wrap');
  const nav=el('div','month-nav');
  const prevB=el('button','month-nav-btn');prevB.textContent='‹';
  prevB.onclick=()=>{sm.monthMo--;if(sm.monthMo<0){sm.monthMo=11;sm.monthYear--;}renderMonthPanel();};
  const title=el('div','month-nav-title');
  title.textContent=MONTHS_FULL[sm.monthMo]+' '+sm.monthYear;
  const nextB=el('button','month-nav-btn');nextB.textContent='›';
  nextB.onclick=()=>{sm.monthMo++;if(sm.monthMo>11){sm.monthMo=0;sm.monthYear++;}renderMonthPanel();};
  nav.appendChild(prevB);nav.appendChild(title);nav.appendChild(nextB);
  wrap.appendChild(nav);
  const DAY_ABB=['Su','Mo','Tu','We','Th','Fr','Sa'];
  const dh=el('div','month-day-hdrs');
  for(let i=0;i<7;i++){const h=el('div','month-day-hdr');h.textContent=DAY_ABB[i];dh.appendChild(h);}
  wrap.appendChild(dh);
  const yr=sm.monthYear,mo=sm.monthMo;
  const firstDow=new Date(yr,mo,1).getDay();
  const daysInMo=new Date(yr,mo+1,0).getDate();
  const me=state.me||'';
  const allShifts=GONDOLAS_WEEKS.flatMap(w=>w.shifts).filter(s=>!s.open);
  const myShifts=me?allShifts.filter(s=>s.name===me):[];
  const grid=el('div','month-grid');
  for(let i=0;i<firstDow;i++) grid.appendChild(el('div','month-cell empty'));
  for(let d=1;d<=daysInMo;d++){
    const dk=String(mo+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const isToday=dk===_todayKey;
    const hasShift=myShifts.some(s=>s.date===dk);
    let cls='month-cell';if(isToday)cls+=' today';if(hasShift)cls+=' has-shift';
    const cell=el('div',cls);
    const num=el('div','month-cell-num');num.textContent=String(d);cell.appendChild(num);
    const anyShift=allShifts.some(s=>s.date===dk);
    if(hasShift){const dot=el('div','month-dot g');cell.appendChild(dot);}
    else if(anyShift&&!me){const dot=el('div','month-dot');dot.style.background='rgba(59,130,246,0.3)';dot.style.width='4px';dot.style.height='4px';dot.style.borderRadius='50%';dot.style.marginTop='3px';cell.appendChild(dot);}
    cell.onclick=()=>{
      for(let wi=0;wi<GONDOLAS_WEEKS.length;wi++){
        const od=getOrdDays(GONDOLAS_WEEKS,wi,state.weekStart);
        const di=od.findIndex(day=>day.k===dk);
        if(di>=0){sm.week=wi;sm.di=di;sm.view='day';sm.monthOpen=false;setWeekDisplay();return;}
      }
    };
    grid.appendChild(cell);
  }
  wrap.appendChild(grid);panel.appendChild(wrap);
}

// ── NAVIGATION ────────────────────────────────────────────────────────────
function goWeek(dir){
  const ni=Math.max(0,Math.min(GONDOLAS_WEEKS.length-1,state.week+dir));
  if(ni!==state.week){state.week=ni;state.view='week';state.di=0;setWeekDisplay();}
}
function setWeekDisplay(){
  const ws=state.weekStart;
  const ordDays=getOrdDays(GONDOLAS_WEEKS,state.week,ws);
  const [fm,fd]=ordDays[0].k.split('-').map(Number);
  const [lm,ld]=ordDays[ordDays.length-1].k.split('-').map(Number);
  const MONS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const rng=fm===lm?`${MONS[fm-1]} ${fd}–${ld}, 2026`:`${MONS[fm-1]} ${fd} – ${MONS[lm-1]} ${ld}, 2026`;
  document.getElementById('week-sub').textContent=rng;
  buildWeekTabs();updateCmpBar();render();
}
// ── WEEK TABS ───────────────────────────────────────────────────────────────────
function buildWeekTabs(){
  const weeks=GONDOLAS_WEEKS,st=state,me=st.me||'',ws=state.weekStart;
  const allShifts=weeks.flatMap(wk=>wk.shifts||[]);
  const SH_TO_L={Mon:'M',Tue:'T',Wed:'W',Thu:'T',Fri:'F',Sat:'S',Sun:'S'};
  const MONS=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  const container=document.getElementById('week-tabs');container.innerHTML='';
  weeks.forEach((w,wi)=>{
    const isAct=wi===st.week;
    const ordDays=getOrdDays(weeks,wi,ws);
    const div=el('div','wtab'+(isAct?' active':''));
    div.onclick=()=>{st.week=wi;st.view='week';st.di=0;setWeekDisplay();};
    const [fm]=ordDays[0].k.split('-').map(Number);
    const [lm]=ordDays[ordDays.length-1].k.split('-').map(Number);
    const md=el('div','wtab-month');
    md.textContent=fm===lm?MONS[fm-1]:MONS[fm-1]+'–'+MONS[lm-1];
    div.appendChild(md);
    const dr=el('div','wtab-days');
    ordDays.forEach((day,ci)=>{
      const dk=day.k,dayNum=parseInt(dk.split('-')[1]);
      const hasMe=me?allShifts.some(s=>s.name===me&&s.date===dk&&!s.open):false;
      const isToday=dk===_todayKey;
      const isView=isAct&&st.view==='day'&&(ordDays[st.di]||{}).k===dk;
      const dw=el('div','wtab-day');
      const dl=el('div','wtab-dl');dl.textContent=SH_TO_L[day.sh]||day.sh[0];dw.appendChild(dl);
      let dnCls='wtab-dn';
      if(isToday)dnCls+=' today';else if(hasMe)dnCls+=' working';
      if(isView)dnCls+=hasMe?' viewing working':' viewing';
      const dn=el('div',dnCls);dn.textContent=String(dayNum);
      dn.onclick=e=>{e.stopPropagation();st.week=wi;st.di=ci;st.view='day';setWeekDisplay();};
      dw.appendChild(dn);dr.appendChild(dw);
    });
    div.appendChild(dr);container.appendChild(div);
  });
  const activeTab=container.querySelector('.wtab.active');
  if(activeTab)container.scrollLeft=activeTab.offsetLeft-container.offsetWidth/2+activeTab.offsetWidth/2;
}
// ── NEXT SHIFT / HOURS BAR ───────────────────────────────────────────────────────
function updateCmpBar(){
  const bar=document.getElementById('next-shift-bar');
  const me=state.me||'';
  bar.style.display='flex';
  if(!me){
    const nowShifts=GONDOLAS_WEEKS[state.week].shifts.filter(s=>!s.open);
    bar.innerHTML=`<span class="ns-label">This week</span><span class="ns-content">${nowShifts.length} shifts</span>`;
  } else {
    const nowM=_now.getHours()*60+_now.getMinutes();
    const allMine=GONDOLAS_WEEKS.flatMap(w=>w.shifts).filter(s=>s.name===me&&!s.open)
      .sort((a,b)=>a.date!==b.date?a.date.localeCompare(b.date):toM(a.s)-toM(b.s));
    const next=allMine.find(s=>s.date>_todayKey||(s.date===_todayKey&&toM(s.e)>nowM));
    if(!next){bar.innerHTML=`<span class="ns-label">Next shift</span><span class="ns-content">None scheduled</span>`;}
    else{
      const allDays=GONDOLAS_WEEKS.flatMap(w=>w.days);
      const dayObj=allDays.find(d=>d.k===next.date);
      const isToday=next.date===_todayKey;
      const loc=next.loc==='dt'?'Downtown':'Snack Bar';
      const hrs=(toM(next.e)-toM(next.s))/60;
      bar.innerHTML=`<span class="ns-label">${isToday?'Today':'Next shift'}</span>`+
        `<span class="ns-content">${isToday?'':((dayObj?dayObj.sh:'')+' · ')}${fmtM(toM(next.s))} – ${fmtM(toM(next.e))} · ${loc}</span>`+
        (next.stn?`<span class="ns-stn">${next.stn}</span>`:'')+
        `<span class="ns-stn">· ${hrs%1===0?hrs:hrs.toFixed(1)}h shift</span>`;
    }
  }
  const hrs=me?GONDOLAS_WEEKS[state.week].shifts.filter(s=>s.name===me&&!s.open).reduce((t,s)=>t+(toM(s.e)-toM(s.s))/60,0):0;
  const hb=document.getElementById('hrs-badge');
  hb.style.display=me?'inline-block':'none';
  if(me)hb.textContent=(hrs%1===0?hrs:hrs.toFixed(1))+'h this week';
  const cmpBar=document.getElementById('cmp-bar');
  if(!me){cmpBar.style.display='none';return;}
  cmpBar.style.display='flex';
  const chips=document.getElementById('cmp-chips');chips.innerHTML='';
  (state.cmp||[]).forEach(n=>{
    const chip=el('div','cmp-chip');chip.textContent=n.split(' ')[0];
    const x=document.createElement('button');x.className='cmp-chip-x';x.textContent='×';
    x.onclick=e=>{e.stopPropagation();state.cmp=state.cmp.filter(c=>c!==n);updateCmpBar();render();};
    chip.appendChild(x);chips.appendChild(chip);
  });
}
// ── COMPARE SHEET ─────────────────────────────────────────────────────────
function openCmpSheet(){
  const list=document.getElementById('cmp-list');list.innerHTML='';
  const emps=[...new Set(GONDOLAS_WEEKS[state.week].shifts.filter(x=>!x.open).map(x=>x.name))].sort();
  emps.filter(n=>n!==(state.me||'')).forEach(n=>{
    const item=el('div','cmp-list-item'+(st.cmp.includes(n)?' selected':''));

    item.onclick=()=>{if(state.cmp.includes(n))state.cmp=state.cmp.filter(c=>c!==n);else state.cmp.push(n);updateCmpBar();render();closeCmpSheet();};
    list.appendChild(item);
  });
  const sheet=document.getElementById('cmp-sheet');sheet.style.display='block';
  requestAnimationFrame(()=>{document.getElementById('cmp-backdrop').classList.add('open');sheet.classList.add('open');});
}
function closeCmpSheet(){
  const sheet=document.getElementById('cmp-sheet'),bd=document.getElementById('cmp-backdrop');
  bd.classList.remove('open');sheet.classList.remove('open');
  setTimeout(()=>{sheet.style.display='none';},300);
}
// ── EXPORT ICS ────────────────────────────────────────────────────────────────────
function exportICS(){
  const me=state.me||'';
  const shifts=GONDOLAS_WEEKS[state.week].shifts.filter(s=>s.name===me&&!s.open);
  if(!shifts.length){alert('No shifts found for you this week.');return;}
  const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Gondolas//EN','CALSCALE:GREGORIAN'];
  shifts.forEach(s=>{
    const[mm,dd]=s.date.split('-');const[sh2,sm]=s.s.split(':');const[eh,em]=s.e.split(':');
    const loc=s.loc==='dt'?'Downtown':'Snack Bar';
    lines.push('BEGIN:VEVENT',`UID:gondolas-${s.id}-${Date.now()}@schedule`,
      `DTSTART:2026${mm}${dd}T${sh2}${sm}00`,`DTEND:2026${mm}${dd}T${eh}${em}00`,
      `SUMMARY:Gondolas ${loc}${s.stn?' — '+s.stn:''}`,`LOCATION:Gondolas ${loc}`,
      s.stn?`DESCRIPTION:Station: ${s.stn}`:'DESCRIPTION:','END:VEVENT');
  });
  lines.push('END:VCALENDAR');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([lines.join('\r\n')],{type:'text/calendar'}));
  a.download=`gondolas-${me.split(' ')[0].toLowerCase()}.ics`;a.click();
}
// ── WEEK START PICKER ─────────────────────────────────────────────────────
function toggleWkStartMenu(e){e.stopPropagation();const m=document.getElementById('wk-start-menu');m.style.display=m.style.display==='block'?'none':'block';}
document.addEventListener('click',()=>document.getElementById('wk-start-menu').style.display='none');
(function(){
  const days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],menu=document.getElementById('wk-start-menu');
  days.forEach((d,i)=>{
    const opt=el('div','wk-start-opt'+(i===state.weekStart?' active':''));
    opt.textContent='Start on '+d;
    opt.onclick=e=>{e.stopPropagation();state.weekStart=i;localStorage.setItem('gondolas_wkstart',String(i));
      document.getElementById('wk-start-lbl').textContent=d.slice(0,2);
      document.querySelectorAll('.wk-start-opt').forEach((o,j)=>o.classList.toggle('active',j===i));
      document.getElementById('wk-start-menu').style.display='none';buildWeekTabs();render();};
    menu.appendChild(opt);
  });
  const dlbls=['Su','Mo','Tu','We','Th','Fr','Sa'];
  document.getElementById('wk-start-lbl').textContent=['Su','Mo','Tu','We','Th','Fr','Sa'][state.weekStart]||'Mo';
})();
// ── DROPDOWN ─────────────────────────────────────────────────────────────
function populateDropdown(){
  const sel=document.getElementById('emp-select');
  const prev=state.me||'';
  sel.innerHTML='<option value="">&#128100; Who are you?</option>';
  const emps=[...new Set(GONDOLAS_WEEKS[state.week].shifts.filter(x=>!x.open).map(x=>x.name))].sort();
  emps.forEach(n=>{const o=document.createElement('option');o.value=n;o.textContent=n;if(n===prev)o.selected=true;sel.appendChild(o);});
}
document.getElementById('emp-select').addEventListener('change',e=>{
  state.me=e.target.value;state.cmp=[];
  if(e.target.value)localStorage.setItem('gondolas_me',e.target.value);
  updateCmpBar();render();
});
// ── KEYBOARD ─────────────────────────────────────────────────────────────
document.addEventListener('keydown',e=>{
  if(state.view==='day'){
    if(e.key==='ArrowRight'){state.di=Math.min(GONDOLAS_WEEKS[state.week].days.length-1,state.di+1);buildWeekTabs();updateCmpBar();render();}
    if(e.key==='ArrowLeft'){state.di=Math.max(0,state.di-1);buildWeekTabs();updateCmpBar();render();}
    if(e.key==='Escape'){state.view='week';render();}
  } else {
    if(e.key==='ArrowRight')goWeek(1);
    if(e.key==='ArrowLeft')goWeek(-1);
  }
});
// ── PWA ───────────────────────────────────────────────────────────────────
(function(){
  const S=512,cv=document.createElement('canvas');cv.width=cv.height=S;
  const ctx=cv.getContext('2d'),img=new Image();
  img.onload=()=>{
    ctx.fillStyle='#ffffff';ctx.fillRect(0,0,S,S);
    const pad=S*.12,maxW=S-pad*2,maxH=S-pad*2;
    const ratio=Math.min(maxW/img.naturalWidth,maxH/img.naturalHeight);
    ctx.drawImage(img,(S-img.naturalWidth*ratio)/2,(S-img.naturalHeight*ratio)/2,img.naturalWidth*ratio,img.naturalHeight*ratio);
    const atl=document.createElement('link');atl.rel='apple-touch-icon';atl.href=cv.toDataURL('image/png');
    document.head.appendChild(atl);
    cv.toBlob(b=>{
      const manifest={name:"Riley's Schedule",short_name:'Schedule',start_url:'./',display:'standalone',
        background_color:'#ffffff',theme_color:'#07101e',
        icons:[{src:URL.createObjectURL(b),sizes:'512x512',type:'image/png',purpose:'any maskable'}]};
      const ml=document.createElement('link');ml.rel='manifest';
      ml.href=URL.createObjectURL(new Blob([JSON.stringify(manifest)],{type:'application/manifest+json'}));
      document.head.appendChild(ml);
    },'image/png');
  };
  img.src=G_LOGO;
})();
// ── INIT ─────────────────────────────────────────────────────────────────
// Edge nav buttons
(function(){
  document.getElementById('day-prev-edge').onclick=()=>{
    if(state.di>0){state.di--;buildWeekTabs();updateCmpBar();render();}
  };
  document.getElementById('day-next-edge').onclick=()=>{
    if(state.di<GONDOLAS_WEEKS[state.week].days.length-1){state.di++;buildWeekTabs();updateCmpBar();render();}
  };
})();
state.me=localStorage.getItem('gondolas_me')||'';
populateDropdown();
setWeekDisplay();

</script>
