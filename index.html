<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gondolas Schedule</title>
<meta name="theme-color" content="#07101e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gondolas">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.7.0/dist/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#07101e;color:#dce8f5;font-family:'Outfit',system-ui,sans-serif;min-height:100vh}
::-webkit-scrollbar{width:4px;height:4px;background:transparent}
::-webkit-scrollbar-thumb{background:#1a2e46;border-radius:2px}
#app{max-width:480px;margin:0 auto;padding-bottom:24px}
.app-header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;
  border-bottom:1px solid #0e1c2e;background:#050e1a;gap:8px;position:sticky;top:0;z-index:100}
.app-header h1{font-size:13px;font-weight:600;color:#c8d8f0;letter-spacing:.3px;display:flex;align-items:center;gap:6px}
.app-header .sub{font-size:10px;color:#1e3a5a;font-family:'JetBrains Mono',monospace;margin-top:1px}
select{background:#0d1929;border:1px solid #1a2e46;color:#7aa8d0;font-size:11px;
  padding:4px 8px;border-radius:6px;cursor:pointer;font-family:'Outfit',sans-serif;max-width:150px;outline:none}
select:focus{border-color:#2a4a6a}
.hint{font-size:10px;color:#1a3050;font-style:italic;text-align:right;padding:4px 14px 2px}

/* ── WEEK TABS (calendar style) ── */
.week-tabs{display:flex;gap:6px;padding:8px 12px;border-bottom:1px solid #0a1828;
  background:#050e1a;position:sticky;top:52px;z-index:95}
.wtab{flex:1;padding:6px 2px 7px;border-radius:8px;border:1px solid #1a2e46;
  background:transparent;cursor:pointer;transition:background .15s,border-color .15s;text-align:center}
.wtab:hover:not(.active){background:#0a1626;border-color:#243c5a}
.wtab.active{background:rgba(59,130,246,0.09);border-color:rgba(59,130,246,0.32)}
.wtab-month{font-size:8.5px;letter-spacing:1.4px;color:#1e3a5a;font-family:'JetBrains Mono',monospace;
  font-weight:600;margin-bottom:5px;text-transform:uppercase}
.wtab.active .wtab-month{color:#3a6a9a}
.wtab-days{display:flex;justify-content:space-evenly;padding:0 2px}
.wtab-day{display:flex;flex-direction:column;align-items:center;gap:3px}
.wtab-dl{font-size:8px;color:#1a3050;font-family:'JetBrains Mono',monospace;line-height:1}
.wtab-dn{font-size:9.5px;font-weight:500;color:#2d4a6a;font-family:'JetBrains Mono',monospace;line-height:1}
.wtab.active .wtab-dl{color:#1e3a5a}
.wtab.active .wtab-dn{color:#60a5fa}
.wtab-day.is-today .wtab-dl{color:rgba(234,179,8,0.7)}
.wtab-day.is-today .wtab-dn{color:#07101e;background:#eab308;border-radius:50%;
  width:16px;height:16px;display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:8.5px;margin:0 auto}
.wtab-day.is-viewing .wtab-dl{color:rgba(34,197,94,0.7)}
.wtab-day.is-viewing .wtab-dn{color:#07101e;background:#22c55e;border-radius:50%;
  width:16px;height:16px;display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:8.5px;margin:0 auto}
.wtab-day.is-viewing-off .wtab-dl{color:rgba(100,130,160,0.5)}
.wtab-day.is-viewing-off .wtab-dn{color:#c8d8f0;background:rgba(100,130,160,0.25);border-radius:50%;
  width:16px;height:16px;display:flex;align-items:center;justify-content:center;
  font-weight:600;font-size:8.5px;margin:0 auto}
.wtab-day.is-working .wtab-dl{color:rgba(74,222,128,0.65)}
.wtab-day.is-working .wtab-dn{color:#4ade80;font-weight:700}

/* ── WEEK VIEW ── */
.week-header{display:flex;border-bottom:1px solid #0a1828}
.week-header .axis-spacer{flex-shrink:0}
.wk-day-hdr{flex:1;text-align:center;padding:5px 0 4px;cursor:pointer;
  border-left:1px solid #0a1828;transition:background .12s}
.wk-day-hdr:hover{background:#0d1929}
.wk-day-hdr.working{background:rgba(202,138,4,0.08)}
.wk-day-hdr .day-name{font-size:11px;font-weight:500;color:#2d4a6a}
.wk-day-hdr.working{background:rgba(74,222,128,0.07)}
.wk-day-hdr.working .day-name{color:#4ade80;font-weight:600}
.wk-day-hdr.today .day-name{color:#eab308;font-weight:600}
.wk-day-hdr.today{background:rgba(234,179,8,0.08)}
.wk-day-hdr .day-dot{width:4px;height:4px;border-radius:50%;background:#4ade80;margin:2px auto 0}
.today-dot{width:4px;height:4px;border-radius:50%;background:#eab308;margin:2px auto 0;opacity:.8}
.week-grid{display:flex;position:relative}
.wk-axis{flex-shrink:0;position:relative}
.wk-axis-lbl{position:absolute;right:4px;font-size:10px;color:#1a3050;
  font-family:'JetBrains Mono',monospace;transform:translateY(-50%);line-height:1;white-space:nowrap}
.week-cols{flex:1;display:flex;position:relative}
.wk-gridline{position:absolute;left:0;right:0;border-top:1px solid #0a1828;pointer-events:none}
.wk-pmline{position:absolute;left:0;right:0;border-top:1px solid rgba(202,138,4,0.2);pointer-events:none}
.wk-day-col{flex:1;display:flex;cursor:pointer;position:relative;border-left:1px solid #0a1828}
.wk-sub{flex:1;position:relative;overflow:hidden}
.wk-bar{position:absolute;left:0;right:0}
.week-legend{display:flex;justify-content:center;align-items:center;gap:14px;
  padding:8px 0;border-top:1px solid #0a1828}
.legend-item{display:flex;align-items:center;gap:5px;font-size:11px;color:#2d4a6a}
.legend-swatch{width:10px;height:10px;border-radius:2px;flex-shrink:0}

/* ── DAY VIEW ── */
.day-strip{display:flex;align-items:center;padding:7px 8px;
  border-bottom:1px solid #0a1828;gap:4px;overflow-x:auto;
  background:#050e1a;flex-wrap:nowrap;position:sticky;top:110px;z-index:90}
.day-strip::-webkit-scrollbar{height:0}
.day-btn:hover{background:#0d1929;color:#4a7a9b}
.day-btn.today{border-color:rgba(234,179,8,0.55);color:#eab308;background:rgba(234,179,8,0.1)}
.day-btn.active{background:rgba(34,197,94,0.16);border-color:rgba(34,197,94,0.5);
  color:#22c55e;font-weight:600}
.day-btn.active-off{background:transparent;border-color:rgba(100,130,160,0.4);color:#4a7a9b;font-weight:600}
.day-btn.working{border-color:rgba(74,222,128,0.4);color:#4ade80;opacity:.85}
.back-btn{cursor:pointer;font-size:11px;padding:4px 10px;border-radius:6px;
  border:1px solid #1a2e46;background:transparent;color:#3b82f6;
  font-family:'Outfit',sans-serif;font-weight:500;flex-shrink:0;transition:background .12s}
.back-btn:hover{background:#0d1929}
.day-title{padding:8px 14px 4px}
.day-title h2{font-size:16px;font-weight:600;color:#c8d8f0}
.col-hdrs{display:flex;padding:0 8px 6px;gap:6px}
.col-hdr{flex:1;text-align:center;font-size:11px;font-weight:600;letter-spacing:.7px;
  padding:4px 0;border-radius:4px;display:flex;align-items:center;justify-content:center;gap:4px}
.col-hdr.dt{color:#60a5fa;background:rgba(59,130,246,0.1)}
.col-hdr.sb{color:#f87171;background:rgba(239,68,68,0.1)}
.time-grid{display:flex;position:relative}
.t-axis{flex-shrink:0;position:relative}
.t-axis-lbl{position:absolute;right:5px;font-size:11px;color:#1e3a5a;
  font-family:'JetBrains Mono',monospace;transform:translateY(-50%);line-height:1;white-space:nowrap}
.t-axis-pm{position:absolute;right:4px;font-size:10px;color:rgba(202,138,4,0.7);
  font-family:'JetBrains Mono',monospace;font-weight:600;transform:translateY(-50%);line-height:1}
.t-content{flex:1;position:relative;display:flex;gap:6px;padding-right:6px}
.t-hrline{position:absolute;left:0;right:0;border-top:1px solid #0a1828;pointer-events:none}
.t-halfline{position:absolute;left:0;right:0;border-top:1px dashed rgba(14,28,46,0.7);pointer-events:none}
.t-pmline{position:absolute;left:0;right:0;border-top:1px solid rgba(202,138,4,0.25);pointer-events:none}
.loc-col{flex:1;position:relative}
.shift{position:absolute;border-radius:0 4px 4px 0;padding:2px 5px;overflow:hidden;box-sizing:border-box}
.shift-name{font-size:11px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shift-stn{font-size:10px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.7;margin-top:1px}
.shift.dt{background:rgba(59,130,246,0.14);border:.5px solid rgba(59,130,246,0.5);border-left:2.5px solid #3b82f6}
.shift.dt .shift-name{color:#93c5fd}
.shift.dt .shift-stn{color:#60a5fa}
.shift.sb{background:rgba(239,68,68,0.13);border:.5px solid rgba(239,68,68,0.5);border-left:2.5px solid #ef4444}
.shift.sb .shift-name{color:#fca5a5}
.shift.sb .shift-stn{color:#f87171}
.shift.me{background:rgba(74,222,128,0.18);border:.5px solid rgba(74,222,128,0.55);border-left:2.5px solid #4ade80;z-index:20!important}
.shift.me .shift-name{color:#bbf7d0;font-weight:600}
.shift.me .shift-stn{color:#86efac}
.shift.open{background:rgba(55,65,81,0.15);border:.5px solid rgba(55,65,81,0.4);border-left:2.5px solid #4b5563}
.shift.open .shift-name{color:#6b7280}
.shift.open .shift-stn{color:#6b7280}
.footer{display:flex;border-top:1px solid #0a1828;margin-top:8px;background:#050e1a}
.footer-cell{flex:1;padding:12px 0;text-align:center}
.footer-cell:first-child{border-right:1px solid #0a1828}
.footer-lbl{font-size:11px;font-weight:600;letter-spacing:.5px;margin-bottom:8px}
.footer-lbl.dt{color:#60a5fa}
.footer-lbl.sb{color:#f87171}
.footer-nums{display:flex;justify-content:center;gap:20px}
.footer-num{text-align:center}
.footer-period{font-size:11px;color:#1e3a5a;margin-bottom:2px;font-family:'JetBrains Mono',monospace}
.footer-val{font-size:28px;font-weight:600;color:#c8d8f0;font-family:'JetBrains Mono',monospace;line-height:1.1;font-variant-numeric:tabular-nums}

/* ── SHIFT POPUP ── */
#shift-popup{position:fixed;z-index:300;background:#0c1a2e;border:1px solid #1e3a5a;
  border-radius:10px;padding:11px 14px;min-width:158px;max-width:230px;
  box-shadow:0 6px 24px rgba(0,0,0,0.6);pointer-events:none;
  opacity:0;transition:opacity .14s,transform .14s;transform:scale(0.95);display:none}
#shift-popup.visible{opacity:1;transform:scale(1);pointer-events:auto}
.sp-name{font-size:13px;font-weight:600;margin-bottom:6px;line-height:1.3}
.sp-name.dt{color:#93c5fd}
.sp-name.sb{color:#fca5a5}
.sp-name.me{color:#bbf7d0}
.sp-name.open{color:#9ca3af}
.sp-row{display:flex;align-items:center;gap:6px;margin-top:4px}
.sp-icon{font-size:11px;color:#1e3a5a;flex-shrink:0;width:14px;text-align:center}
.sp-text{font-size:11px;color:#4a7a9b;font-family:'JetBrains Mono',monospace;line-height:1.3}
.sp-stn{font-size:11px;color:#2d5a7a;font-style:italic;line-height:1.3}
.sp-badge{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:600;
  letter-spacing:.5px;padding:2px 7px;border-radius:4px;margin-top:6px}
.sp-badge.dt{color:#60a5fa;background:rgba(59,130,246,0.12);border:1px solid rgba(59,130,246,0.2)}
.sp-badge.sb{color:#f87171;background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.18)}
.sp-badge.open{color:#6b7280;background:rgba(75,85,99,0.12);border:1px solid rgba(75,85,99,0.2)}
.sp-name.cmp{color:#86efac}
.sp-badge.cmp{color:#22c55e;background:rgba(34,197,94,0.1);border:1px solid rgba(34,197,94,0.25)}

/* ── POPUP ACTION BUTTONS ── */
.sp-actions{display:flex;gap:6px;margin-top:10px}
.sp-action-btn{flex:1;padding:7px 4px;border-radius:7px;font-size:11px;font-weight:600;
  cursor:pointer;font-family:'Outfit',sans-serif;transition:opacity .15s;text-align:center;line-height:1.3}
.sp-action-btn.sp-hl{background:rgba(74,222,128,0.14);color:#4ade80;border:1px solid rgba(74,222,128,0.4)}
.sp-action-btn.sp-hl:active{opacity:.7}
.sp-action-btn.sp-hl.is-me{background:rgba(74,222,128,0.06);color:#22c55e;border-color:rgba(74,222,128,0.2);cursor:default}
.sp-action-btn.sp-cmp{background:rgba(34,197,94,0.12);color:#86efac;border:1px solid rgba(34,197,94,0.35)}
.sp-action-btn.sp-cmp:active{opacity:.7}
.sp-action-btn.sp-cmp.is-cmp{background:rgba(239,68,68,0.1);color:#fca5a5;border:1px solid rgba(239,68,68,0.3)}

/* ── COMPARISON SHIFTS ── */
.shift.cmp{background:rgba(34,197,94,0.16);border:.5px solid rgba(34,197,94,0.5);border-left:2.5px solid #22c55e;z-index:15!important}
.shift.cmp .shift-name{color:#86efac;font-weight:600}
.shift.cmp .shift-stn{color:#4ade80}

/* ── BIGGER DAY BUTTONS ── */
.day-btn{cursor:pointer;font-size:13px;padding:11px 14px;border-radius:8px;
  border:1px solid #0e1c2e;background:transparent;color:#2d4a6a;
  font-family:'Outfit',sans-serif;font-weight:500;flex-shrink:0;white-space:nowrap;
  transition:background .12s,color .12s}

/* ── COMPARE BAR ── */
#cmp-bar{display:none;align-items:center;padding:6px 12px;gap:8px;flex-wrap:wrap;
  border-bottom:1px solid #0a1828;background:#050e1a;min-height:38px}
.cmp-label{font-size:10px;color:#1e3a5a;font-weight:600;letter-spacing:.5px;white-space:nowrap;text-transform:uppercase}
#cmp-chips{display:flex;gap:5px;flex-wrap:wrap;flex:1}
.cmp-chip{display:inline-flex;align-items:center;gap:4px;background:rgba(34,197,94,0.13);
  border:1px solid rgba(34,197,94,0.35);border-radius:12px;padding:3px 6px 3px 10px;
  font-size:11px;color:#86efac}
.cmp-chip-x{background:none;border:none;color:#16a34a;cursor:pointer;font-size:15px;
  line-height:1;padding:0;margin:0;font-family:sans-serif}
#cmp-add-btn{background:rgba(59,130,246,0.1);border:1px solid rgba(59,130,246,0.3);
  border-radius:6px;color:#60a5fa;font-size:12px;cursor:pointer;padding:4px 11px;
  font-family:'Outfit',sans-serif;white-space:nowrap;flex-shrink:0}

/* ── COMPARE SHEET ── */
#cmp-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:190;
  opacity:0;pointer-events:none;transition:opacity .25s}
#cmp-backdrop.open{opacity:1;pointer-events:auto}
#cmp-sheet{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;
  background:#0d1929;border-radius:16px 16px 0 0;border-top:1px solid #1a2e46;
  z-index:200;transform:translateY(100%);transition:transform .3s ease;max-height:72vh;overflow-y:auto}
#cmp-sheet.open{transform:translateY(0)}
.cmp-sheet-hdr{display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px;border-bottom:1px solid #0a1828;position:sticky;top:0;background:#0d1929;z-index:1}
.cmp-sheet-title{font-size:14px;font-weight:600;color:#c8d8f0}
.cmp-sheet-done{background:rgba(59,130,246,0.12);border:1px solid rgba(59,130,246,0.3);
  border-radius:8px;color:#60a5fa;font-size:12px;font-weight:600;padding:5px 14px;
  cursor:pointer;font-family:'Outfit',sans-serif}
.cmp-item{display:flex;align-items:center;gap:12px;padding:13px 16px;
  border-bottom:1px solid #0a1828;cursor:pointer;transition:background .1s}
.cmp-item:active{background:#0a1828}
.cmp-check{width:18px;height:18px;border-radius:5px;border:2px solid #1e3a5a;
  flex-shrink:0;transition:all .15s;display:flex;align-items:center;justify-content:center}
.cmp-check.checked{background:#22c55e;border-color:#22c55e}
.cmp-check.checked::after{content:'✓';font-size:11px;color:#07101e;font-weight:700}
.cmp-name{font-size:13px;color:#4a7a9b}
.cmp-item.selected .cmp-name{color:#86efac;font-weight:500}

/* ── PASSWORD SCREEN ── */
#pw-screen{position:fixed;inset:0;background:#07101e;z-index:500;
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px}
.pw-icon{font-size:52px;margin-bottom:12px;line-height:1}
.pw-app-name{font-size:24px;font-weight:700;color:#c8d8f0;letter-spacing:.3px;margin-bottom:6px}
.pw-subtitle{font-size:13px;color:#2d5a7a;margin-bottom:32px;text-align:center}
.pw-input-wrap{position:relative;width:100%;max-width:240px;margin-bottom:12px}
#pw-input{width:100%;background:#0d1929;border:1px solid #1a2e46;border-radius:10px;
  color:#c8d8f0;font-size:18px;padding:14px 16px;text-align:center;outline:none;
  font-family:'JetBrains Mono',monospace;letter-spacing:4px;
  transition:border-color .15s}
#pw-input:focus{border-color:#3b82f6}
#pw-input::placeholder{letter-spacing:1px;font-size:13px;color:#1e3a5a;font-family:'Outfit',sans-serif}
#pw-submit{width:100%;max-width:240px;background:#3b82f6;border:none;border-radius:10px;
  color:#fff;font-size:14px;font-weight:600;padding:14px 0;cursor:pointer;
  font-family:'Outfit',sans-serif;transition:opacity .15s;margin-bottom:10px}
#pw-submit:active{opacity:.8}
.pw-error{font-size:12px;color:#ef4444;min-height:18px;text-align:center}

/* ── WEEK START PICKER ── */
#wk-start-btn{background:#0d1929;border:1px solid #1a2e46;border-radius:6px;color:#4a7a9b;
  font-size:11px;padding:5px 9px;cursor:pointer;display:flex;align-items:center;gap:5px;
  font-family:'Outfit',sans-serif;flex-shrink:0;white-space:nowrap}
#wk-start-btn:hover{border-color:#2a4a6a;color:#7aa8d0}
#wk-start-menu{position:fixed;z-index:150;background:#0c1a2e;border:1px solid #1e3a5a;
  border-radius:10px;padding:11px 13px;box-shadow:0 6px 24px rgba(0,0,0,0.55);display:none}
#wk-start-menu.open{display:block}
.wks-title{font-size:10px;color:#1e3a5a;letter-spacing:.6px;text-transform:uppercase;
  font-weight:600;margin-bottom:8px}
.wks-days{display:flex;gap:5px}
.wks-day{background:#0d1929;border:1px solid #1a2e46;border-radius:5px;color:#2d4a6a;
  font-size:11px;font-weight:500;padding:6px 8px;cursor:pointer;
  font-family:'JetBrains Mono',monospace;transition:all .12s}
.wks-day:hover{background:#1a2e46;color:#7aa8d0}
.wks-day.active{background:rgba(59,130,246,0.15);border-color:rgba(59,130,246,0.4);color:#60a5fa}
</style>
</head>
<body>
<div id="pw-screen">
  <div class="pw-icon">🚡</div>
  <div class="pw-app-name">Gondolas</div>
  <div class="pw-subtitle">Enter the password to continue</div>
  <input id="pw-input" type="password" placeholder="password" autocomplete="off" autocorrect="off" spellcheck="false">
  <button id="pw-submit" onclick="checkPassword()">Unlock</button>
  <div class="pw-error" id="pw-error"></div>
</div>
<div id="app">
  <div class="app-header">
    <div>
      <h1><i class="ti ti-calendar" aria-hidden="true"></i> Gondolas Schedule</h1>
      <div class="sub" id="week-sub"></div>
    </div>
    <div style="display:flex;align-items:center;gap:6px">
      <button id="wk-start-btn" onclick="toggleWkStartMenu(event)" title="Week start day">
        <i class="ti ti-calendar-week" style="font-size:12px"></i>
        <span id="wk-start-lbl">Mo</span>
      </button>
      <select id="emp-select"><option value="">&#128100; Who are you?</option></select>
    </div>
  </div>
  <div class="week-tabs" id="week-tabs"></div>
  <div id="cmp-bar">
    <span class="cmp-label">Compare</span>
    <div id="cmp-chips"></div>
    <button id="cmp-add-btn" onclick="openCmpSheet()">＋ Add</button>
  </div>
  <div id="main"></div>

const TS=570,TE=1260,PD=1.3,PW=0.52,PM=930;
const toM=t=>{const[h,m]=t.split(':').map(Number);return h*60+m;};
const fmtM=m=>{const h=Math.floor(m/60),mn=m%60,pm=h>=12,dh=h>12?h-12:h===0?12:h;
  return `${dh}${mn?':'+String(mn).padStart(2,'0'):''}${pm?'p':'a'}`;};
const TICKS=[];for(let m=TS;m<=TE;m+=30)TICKS.push(m);
const HTICKS=TICKS.filter(m=>m%60===0);

// Find which week contains today, fallback to latest
const _todayKey=(()=>{const n=new Date();return(n.getMonth()+1+'').padStart(2,'0')+'-'+(n.getDate()+'').padStart(2,'0');})();
const _initWeek=(()=>{const i=WEEKS.findIndex(wk=>wk.days.some(d=>d.k===_todayKey));return i>=0?i:WEEKS.length-1;})();
let state={view:'week',di:0,me:'',week:_initWeek,cmp:[],weekStart:parseInt(localStorage.getItem('gondolas_wkstart')||'0')};
function W(){return WEEKS[state.week];}
function S(){return W().shifts;}
function D(){return W().days;}
function goDay(dir){
  const newDi=state.di+dir;
  if(newDi<0){
    // Cross back into previous week's last day
    if(state.week>0){
      state.week--;
      state.di=D().length-1;
      document.getElementById('week-sub').textContent=W().range;
    }
    // At oldest week — do nothing, don't wrap
  } else if(newDi>=D().length){
    // Cross forward into next week's first day
    if(state.week<WEEKS.length-1){
      state.week++;
      state.di=0;
      document.getElementById('week-sub').textContent=W().range;
    }
    // At newest week — do nothing, don't wrap
  } else {
    state.di=newDi;
  }
  render();
}
function goWeek(dir){const wi=Math.max(0,Math.min(WEEKS.length-1,state.week+dir));if(wi!==state.week)setWeek(wi);}

function doLayout(shifts){
  const ss=[...shifts].map(s=>({...s})).sort((a,b)=>toM(a.s)-toM(b.s));
  const ends=[];
  for(const s of ss){
    const sm=toM(s.s);let c=ends.findIndex(e=>e<=sm);
    if(c<0)c=ends.length;s._c=c;ends[c]=toM(s.e);
  }
  const n=ss.length,par=Array.from({length:n},(_,i)=>i);
  const find=i=>{while(par[i]!==i){par[i]=par[par[i]];i=par[i];}return i;};
  const union=(a,b)=>{a=find(a);b=find(b);if(a!==b)par[a]=b;};
  for(let i=0;i<n;i++)for(let j=i+1;j<n;j++)
    if(toM(ss[i].s)<toM(ss[j].e)&&toM(ss[j].s)<toM(ss[i].e))union(i,j);
  const cmax={};
  for(let i=0;i<n;i++){const c=find(i);cmax[c]=Math.max(cmax[c]||0,ss[i]._c);}
  for(let i=0;i<n;i++)ss[i]._n=cmax[find(i)]+1;
  return ss;
}

function el(tag,cls,style){
  const e=document.createElement(tag);
  if(cls)e.className=cls;
  if(style)Object.assign(e.style,style);
  return e;
}

function buildShift(sh,me,loc){
  const isMe=sh.name===me,isOp=!!sh.open,isCmp=state.cmp.includes(sh.name);
  const top=(toM(sh.s)-TS)*PD+1;
  const ht=Math.max(18,(toM(sh.e)-toM(sh.s))*PD-2);
  const pct=100/sh._n;
  const cls='shift '+(isMe?'me':isCmp?'cmp':isOp?'open':loc);
  const abbrev=sh._n>=4?sh.name.split(' ')[0].slice(0,4):sh._n===3?sh.name.split(' ')[0].slice(0,6):sh.name.split(' ')[0];
  const d=el('div',cls,{position:'absolute',top:top+'px',height:ht+'px',
    left:`${pct*sh._c}%`,width:`calc(${pct}% - 2px)`,zIndex:isMe?'20':isCmp?'15':'1'});
  const nm=el('div','shift-name');
  nm.textContent=isOp?'Open':isMe?`\u2605 ${abbrev}`:isCmp?`\u263a ${abbrev}`:abbrev;
  d.appendChild(nm);
  if(ht>32&&sh.stn){const stn=el('div','shift-stn');stn.textContent=sh.stn;d.appendChild(stn);}
  d.addEventListener('mouseenter',()=>{clearTimeout(_hideTimer);showPopup(sh,d);});
  d.addEventListener('mouseleave',()=>{if(!_popPinned)_hideTimer=setTimeout(forceHidePopup,250);});
  d.addEventListener('click',e=>{e.stopPropagation();_popPinned=true;showPopup(sh,d);});
  return d;
}

function buildLocCol(shifts,me,loc){
  const laid=doLayout(shifts);
  const col=el('div','loc-col',{height:(TE-TS)*PD+'px'});
  laid.forEach(sh=>col.appendChild(buildShift(sh,me,loc)));
  return col;
}

function renderDay(){
  const days=D(),shifts=S(),day=days[state.di];
  const all=shifts.filter(s=>s.date===day.k);
  const dtS=all.filter(s=>s.loc==='dt'),sbS=all.filter(s=>s.loc==='sb');
  const AW=42;
  const now=new Date();
  const todayKey=(now.getMonth()+1+'').padStart(2,'0')+'-'+(now.getDate()+'').padStart(2,'0');
  const amDT=dtS.filter(s=>!s.open&&toM(s.s)<PM).length;
  const pmDT=dtS.filter(s=>!s.open&&toM(s.e)>PM).length;
  const amSB=sbS.filter(s=>!s.open&&toM(s.s)<PM).length;
  const pmSB=sbS.filter(s=>!s.open&&toM(s.e)>PM).length;
  const wrap=el('div');
  // Swipe left/right to navigate days
  let _tx=0,_ty=0;
  wrap.addEventListener('touchstart',e=>{_tx=e.touches[0].clientX;_ty=e.touches[0].clientY;},{passive:true});
  wrap.addEventListener('touchend',e=>{
    const dx=e.changedTouches[0].clientX-_tx,dy=e.changedTouches[0].clientY-_ty;
    if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5) goDay(dx<0?1:-1);
  },{passive:true});

  const strip=el('div','day-strip');
  const back=el('button','back-btn');
  back.innerHTML='<i class="ti ti-arrow-left" style="font-size:12px;margin-right:3px"></i>Week';
  back.onclick=()=>{state.view='week';render();};
  strip.appendChild(back);
  days.forEach((d,i)=>{
    const hasMe=shifts.some(s=>s.date===d.k&&s.name===state.me);
    const isToday=d.k===todayKey;
    const isActive=i===state.di;
    let btnCls='day-btn';
    if(isActive){
      if(hasMe) btnCls+=' active';           // viewing + working → green
      else if(isToday) btnCls+=' today';      // viewing today but off → amber
      else btnCls+=' active-off';             // viewing, not working, not today → grey
    } else if(isToday) btnCls+=' today';
    else if(hasMe) btnCls+=' working';
    const btn=el('button',btnCls);
    btn.textContent=d.sh;btn.onclick=()=>{state.di=i;render();};
    strip.appendChild(btn);
  });
  wrap.appendChild(strip);

  const titleDiv=el('div','day-title');
  const h2=el('h2');h2.textContent=day.lg;titleDiv.appendChild(h2);
  wrap.appendChild(titleDiv);

  const hdrs=el('div','col-hdrs');
  hdrs.appendChild(el('div','',{width:AW+'px',flexShrink:'0'}));
  [['dt','ti-map-pin','Downtown'],['sb','ti-droplet','Snack Bar']].forEach(([loc,ico,lbl])=>{
    const h=el('div',`col-hdr ${loc}`);
    h.innerHTML=`<i class="ti ${ico}" style="font-size:12px"></i>${lbl.toUpperCase()}`;
    hdrs.appendChild(h);
  });
  wrap.appendChild(hdrs);

  const grid=el('div','time-grid');
  const ax=el('div','t-axis',{width:AW+'px',height:(TE-TS)*PD+'px'});
  HTICKS.forEach(m=>{const lb=el('div','t-axis-lbl',{top:(m-TS)*PD+'px'});lb.textContent=fmtM(m);ax.appendChild(lb);});
  const pmLb=el('div','t-axis-pm',{top:(PM-TS)*PD+'px'});pmLb.textContent='3:30p';ax.appendChild(pmLb);
  grid.appendChild(ax);
  const content=el('div','t-content');
  HTICKS.forEach(m=>content.appendChild(el('div','t-hrline',{top:(m-TS)*PD+'px'})));
  TICKS.filter(m=>m%60!==0).forEach(m=>content.appendChild(el('div','t-halfline',{top:(m-TS)*PD+'px'})));
  content.appendChild(el('div','t-pmline',{top:(PM-TS)*PD+'px'}));
  content.appendChild(buildLocCol(dtS,state.me,'dt'));
  content.appendChild(buildLocCol(sbS,state.me,'sb'));
  grid.appendChild(content);
  wrap.appendChild(grid);

  const foot=el('div','footer');
  [['dt','DOWNTOWN',amDT,pmDT],['sb','SNACK BAR',amSB,pmSB]].forEach(([loc,lbl,am,pm])=>{
    const cell=el('div','footer-cell');
    const flbl=el('div',`footer-lbl ${loc}`);flbl.textContent=lbl;cell.appendChild(flbl);
    const nums=el('div','footer-nums');
    [['AM',am],['PM',pm]].forEach(([period,n])=>{
      const stat=el('div','footer-num');
      const p=el('div','footer-period');p.textContent=period;stat.appendChild(p);
      const v=el('div','footer-val');v.textContent=String(n);stat.appendChild(v);
      nums.appendChild(stat);
    });
    cell.appendChild(nums);foot.appendChild(cell);
  });
  wrap.appendChild(foot);
  return wrap;
}

function renderWeek(){
  const days=D(),shifts=S();
  const ws=state.weekStart;
  const ordDays=ws===0?days:[...days.slice(ws),...days.slice(0,ws)];
  const WH=(TE-TS)*PW,AW=36;
  const now=new Date();
  const todayKey=(now.getMonth()+1+'').padStart(2,'0')+'-'+(now.getDate()+'').padStart(2,'0');
  const wrap=el('div');
  let _tx=0,_ty=0;
  wrap.addEventListener('touchstart',e=>{_tx=e.touches[0].clientX;_ty=e.touches[0].clientY;},{passive:true});
  wrap.addEventListener('touchend',e=>{
    const dx=e.changedTouches[0].clientX-_tx,dy=e.changedTouches[0].clientY-_ty;
    if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5) goWeek(dx<0?1:-1);
  },{passive:true});
  const hint=el('div','hint');hint.textContent='tap any day · swipe to change week';wrap.appendChild(hint);

  const hdrRow=el('div','week-header');
  hdrRow.appendChild(el('div','axis-spacer',{width:AW+'px'}));
  ordDays.forEach(d=>{
    const hasMe=shifts.some(s=>s.date===d.k&&s.name===state.me);
    const isToday=d.k===todayKey;
    const cell=el('div',`wk-day-hdr${hasMe?' working':''}${isToday?' today':''}`);
    const nm=el('div','day-name');nm.textContent=d.sh;cell.appendChild(nm);
    if(hasMe){const dot=el('div','day-dot');cell.appendChild(dot);}
    if(isToday&&!hasMe){const dot=el('div','today-dot');cell.appendChild(dot);}
    cell.onclick=()=>{state.di=days.indexOf(d);state.view='day';render();};
    hdrRow.appendChild(cell);
  });
  wrap.appendChild(hdrRow);

  const grid=el('div','week-grid');
  const ax=el('div','wk-axis',{width:AW+'px',height:WH+'px'});
  HTICKS.forEach(m=>{const lb=el('div','wk-axis-lbl',{top:(m-TS)*PW+'px'});lb.textContent=fmtM(m);ax.appendChild(lb);});
  grid.appendChild(ax);
  const cols=el('div','week-cols',{height:WH+'px'});
  HTICKS.forEach(m=>cols.appendChild(el('div','wk-gridline',{top:(m-TS)*PW+'px'})));
  cols.appendChild(el('div','wk-pmline',{top:(PM-TS)*PW+'px'}));
  ordDays.forEach(d=>{
    const all=shifts.filter(s=>s.date===d.k),myS=all.filter(s=>s.name===state.me);
    const cmpS=all.filter(s=>state.cmp.includes(s.name));
    const col=el('div','wk-day-col',{height:WH+'px'});
    col.onclick=()=>{state.di=days.indexOf(d);state.view='day';render();};
    ['dt','sb'].forEach(loc=>{
      const sub=el('div','wk-sub');
      all.filter(s=>s.loc===loc&&s.name!==state.me&&!state.cmp.includes(s.name)).forEach(s=>{
        sub.appendChild(el('div','wk-bar',{top:(toM(s.s)-TS)*PW+'px',
          height:Math.max(1,(toM(s.e)-toM(s.s))*PW)+'px',
          background:loc==='dt'?'rgba(59,130,246,0.2)':'rgba(239,68,68,0.2)'}));
      });
      cmpS.filter(s=>s.loc===loc).forEach(s=>{
        sub.appendChild(el('div','wk-bar',{top:(toM(s.s)-TS)*PW+'px',
          height:Math.max(2,(toM(s.e)-toM(s.s))*PW)+'px',
          background:'rgba(34,197,94,0.65)',zIndex:'4'}));
      });
      myS.filter(s=>s.loc===loc).forEach(s=>{
        sub.appendChild(el('div','wk-bar',{top:(toM(s.s)-TS)*PW+'px',
          height:Math.max(2,(toM(s.e)-toM(s.s))*PW)+'px',
          background:'rgba(74,222,128,0.85)',zIndex:'5'}));
      });
      col.appendChild(sub);
    });
    cols.appendChild(col);
  });
  grid.appendChild(cols);
  wrap.appendChild(grid);

  const leg=el('div','week-legend');
  [['rgba(59,130,246,0.55)','Downtown'],['rgba(239,68,68,0.55)','Snack Bar'],
   ...(state.me?[['rgba(74,222,128,0.85)',state.me.split(' ')[0]]]:[]),
   ...(state.cmp.length?[['rgba(34,197,94,0.65)',state.cmp.length===1?state.cmp[0].split(' ')[0]:'Friends']]:[])
  ].forEach(([col,lbl])=>{
    const item=el('div','legend-item');
    item.appendChild(el('div','legend-swatch',{background:col}));
    const t=document.createTextNode(lbl);item.appendChild(t);
    leg.appendChild(item);
  });
  wrap.appendChild(leg);
  return wrap;
}

function render(){
  updateCmpBar();
  buildWeekTabs();
  document.getElementById('main').innerHTML='';
  document.getElementById('main').appendChild(state.view==='week'?renderWeek():renderDay());
}

let _popPinned=false,_hideTimer=null;

function showPopup(sh,anchor){
  clearTimeout(_hideTimer);
  const pop=document.getElementById('shift-popup');
  const isMe=sh.name===state.me,isOp=!!sh.open,isCmp=state.cmp.includes(sh.name),loc=sh.loc;
  document.getElementById('sp-name').textContent=isOp?'Open Shift':sh.name;
  document.getElementById('sp-name').className='sp-name '+(isMe?'me':isCmp?'cmp':isOp?'open':loc);
  document.getElementById('sp-time-val').textContent=`${fmtM(toM(sh.s))} – ${fmtM(toM(sh.e))}`;
  const stnRow=document.getElementById('sp-stn-row');
  const stnVal=document.getElementById('sp-stn-val');
  if(sh.stn){stnVal.textContent=sh.stn;stnRow.style.display='';}
  else stnRow.style.display='none';
  const badge=document.getElementById('sp-badge');
  badge.className='sp-badge '+(isOp?'open':isCmp?'cmp':loc);
  badge.textContent=isOp?'Open':(loc==='dt'?'Downtown':'Snack Bar');

  const actions=document.getElementById('sp-actions');
  const hlBtn=document.getElementById('sp-hl-btn');
  const cmpBtn=document.getElementById('sp-cmp-btn');
  if(isOp){
    actions.style.display='none';
  } else {
    actions.style.display='flex';
    if(isMe){
      hlBtn.textContent='★ That\'s you';
      hlBtn.className='sp-action-btn sp-hl is-me';
      hlBtn.onclick=null;
    } else {
      hlBtn.textContent='★ Highlight me';
      hlBtn.className='sp-action-btn sp-hl';
      hlBtn.onclick=e=>{
        e.stopPropagation();
        state.me=sh.name;
        state.cmp=state.cmp.filter(n=>n!==sh.name);
        const sel=document.getElementById('emp-select');
        if(sel.querySelector(`option[value="${sh.name}"]`)) sel.value=sh.name;
        updateCmpBar();render();forceHidePopup();
      };
    }
    if(isMe){
      cmpBtn.style.display='none';
    } else {
      cmpBtn.style.display='';
      const inCmp=state.cmp.includes(sh.name);
      cmpBtn.textContent=inCmp?'✕ Remove':'☺ Compare';
      cmpBtn.className='sp-action-btn sp-cmp'+(inCmp?' is-cmp':'');
      cmpBtn.onclick=e=>{
        e.stopPropagation();
        const idx=state.cmp.indexOf(sh.name);
        if(idx>=0) state.cmp.splice(idx,1); else state.cmp.push(sh.name);
        const now=state.cmp.includes(sh.name);
        cmpBtn.textContent=now?'✕ Remove':'☺ Compare';
        cmpBtn.className='sp-action-btn sp-cmp'+(now?' is-cmp':'');
        updateCmpBar();render();
      };
    }
  }

  // Position: top of popup aligns with top of shift, to the right (or left if no room)
  pop.style.display='block';
  pop.classList.remove('visible');
  requestAnimationFrame(()=>{
    const r=anchor.getBoundingClientRect();
    const pw=pop.offsetWidth,ph=pop.offsetHeight;
    const vw=window.innerWidth,vh=window.innerHeight;
    let left=r.right+8;
    if(left+pw>vw-8) left=r.left-pw-8;
    if(left<8) left=8;
    let top=r.top;
    if(top+ph>vh-8) top=vh-ph-8;
    if(top<8) top=8;
    pop.style.left=left+'px';
    pop.style.top=top+'px';
    pop.classList.add('visible');
  });
}

function hidePopup(){
  // Only hide on hover-out if not pinned
  if(_popPinned) return;
  const pop=document.getElementById('shift-popup');
  pop.classList.remove('visible');
  setTimeout(()=>{if(!pop.classList.contains('visible'))pop.style.display='none';},150);
}

function forceHidePopup(){
  _popPinned=false;
  const pop=document.getElementById('shift-popup');
  pop.classList.remove('visible');
  setTimeout(()=>{if(!pop.classList.contains('visible'))pop.style.display='none';},150);
}

// ── COMPARE ──────────────────────────────────────────────────────────────
function updateCmpBar(){
  const bar=document.getElementById('cmp-bar');
  if(!state.me){bar.style.display='none';return;}
  bar.style.display='flex';
  const chips=document.getElementById('cmp-chips');
  chips.innerHTML='';
  state.cmp.forEach(n=>{
    const chip=el('div','cmp-chip');
    chip.textContent=n.split(' ')[0];
    const x=document.createElement('button');
    x.className='cmp-chip-x';x.textContent='×';
    x.onclick=e=>{e.stopPropagation();state.cmp=state.cmp.filter(c=>c!==n);updateCmpBar();render();};
    chip.appendChild(x);chips.appendChild(chip);
  });
}
function openCmpSheet(){
  const list=document.getElementById('cmp-list');
  list.innerHTML='';
  const emps=[...new Set(S().filter(x=>!x.open).map(x=>x.name))].sort();
  emps.filter(n=>n!==state.me).forEach(n=>{
    const isSel=state.cmp.includes(n);
    const item=el('div','cmp-item'+(isSel?' selected':''));
    const chk=el('div','cmp-check'+(isSel?' checked':''));
    const nm=el('div','cmp-name');nm.textContent=n;
    item.appendChild(chk);item.appendChild(nm);
    item.onclick=()=>{
      const idx=state.cmp.indexOf(n);
      if(idx>=0) state.cmp.splice(idx,1); else state.cmp.push(n);
      const sel=state.cmp.includes(n);
      chk.classList.toggle('checked',sel);
      item.classList.toggle('selected',sel);
      updateCmpBar();render();
    };
    list.appendChild(item);
  });
  document.getElementById('cmp-backdrop').classList.add('open');
  document.getElementById('cmp-sheet').classList.add('open');
}
function closeCmpSheet(){
  document.getElementById('cmp-backdrop').classList.remove('open');
  document.getElementById('cmp-sheet').classList.remove('open');
}

function setWeek(wi){
  state.week=wi;
  state.view='week';
  state.di=0;
  document.getElementById('week-sub').textContent=W().range;
  // Rebuild dropdown, keep state.me selected if they work this week
  const prev=state.me;
  const sel=document.getElementById('emp-select');
  sel.innerHTML='<option value="">&#128100; Who are you?</option>';
  const emps=[...new Set(S().filter(x=>!x.open).map(x=>x.name))].sort();
  emps.forEach(n=>{
    const o=document.createElement('option');
    o.value=n;o.textContent=n;
    if(n===prev)o.selected=true;
    sel.appendChild(o);
  });
  // Keep state.me regardless so highlight persists across weeks
  render();
}

// Build calendar-style week tabs
function buildWeekTabs(){
  const now=new Date();
  const todayKey=(now.getMonth()+1+'').padStart(2,'0')+'-'+(now.getDate()+'').padStart(2,'0');
  const viewingKey=state.view==='day'?D()[state.di].k:null;
  const tabsEl=document.getElementById('week-tabs');
  tabsEl.innerHTML='';
  WEEKS.forEach((wk,i)=>{
    const btn=el('button','wtab'+(i===state.week?' active':''));
    const mo=el('div','wtab-month');mo.textContent=wk.month;btn.appendChild(mo);
    const daysRow=el('div','wtab-days');
    wk.calDays.forEach((cd,j)=>{
      const dayKey=wk.days[j].k;
      const isWorkingDay=state.me?wk.shifts.some(s=>s.date===dayKey&&s.name===state.me):false;
      const isViewing=dayKey===viewingKey;
      const isToday=!isViewing&&dayKey===todayKey;
      const isWorking=!isViewing&&!isToday&&isWorkingDay;
      let dayCls='wtab-day';
      if(isViewing) dayCls+=isWorkingDay?' is-viewing':' is-viewing-off';
      else if(isToday) dayCls+=' is-today';
      else if(isWorking) dayCls+=' is-working';
      const day=el('div',dayCls);
      const dl=el('div','wtab-dl');dl.textContent=cd.l;day.appendChild(dl);
      const dn=el('div','wtab-dn');dn.textContent=String(cd.n);day.appendChild(dn);
      daysRow.appendChild(day);
    });
    btn.appendChild(daysRow);
    btn.onclick=()=>setWeek(i);
    tabsEl.appendChild(btn);
  });
}

document.getElementById('emp-select').addEventListener('change',e=>{state.me=e.target.value;state.cmp=[];updateCmpBar();render();});
setWeek(state.week);

  // Inject manifest synchronously so Chrome detects it immediately
  const manifest={
    name:'Gondolas Schedule',short_name:'Gondolas',
    start_url:'./',display:'standalone',
    background_color:'#ffffff',theme_color:'#07101e',
    icons:[{src:logoB64,sizes:'256x193',type:'image/jpeg',purpose:'any'}]
  };
  const ml=document.createElement('link');
  ml.rel='manifest';
  ml.href=URL.createObjectURL(new Blob([JSON.stringify(manifest)],{type:'application/manifest+json'}));
  document.head.appendChild(ml);

  // Async: draw logo on white canvas with black background removed
  const S=512,cv=document.createElement('canvas');
  cv.width=cv.height=S;
  const ctx=cv.getContext('2d');
  const img=new Image();
  img.onload=()=>{
    // Step 1: draw raw image to temp canvas and strip black pixels
    const tmp=document.createElement('canvas');
    tmp.width=img.naturalWidth;tmp.height=img.naturalHeight;
    const tc=tmp.getContext('2d');
    tc.drawImage(img,0,0);
    const id=tc.getImageData(0,0,tmp.width,tmp.height);
    const d=id.data;
    for(let i=0;i<d.length;i+=4){
      if(d[i]<55&&d[i+1]<55&&d[i+2]<55) d[i+3]=0; // transparent black pixels
    }
    tc.putImageData(id,0,0);
    // Step 2: white background square, draw processed image centered
    ctx.fillStyle='#ffffff';
    ctx.fillRect(0,0,S,S);
    const pad=S*0.08,maxW=S-pad*2,maxH=S-pad*2;
    const ratio=Math.min(maxW/img.naturalWidth,maxH/img.naturalHeight);
    const w=img.naturalWidth*ratio,h=img.naturalHeight*ratio;
    ctx.drawImage(tmp,(S-w)/2,(S-h)/2,w,h);
    // Apple touch icon (iOS)
    const atl=document.createElement('link');
    atl.rel='apple-touch-icon';
    atl.href=cv.toDataURL('image/png');
    document.head.appendChild(atl);
  };
  img.src=logoB64;
